<script>
(function () {
  var errors = [];
  function render() {
    if (!document.body) { document.addEventListener('DOMContentLoaded', render); return; }
    var box = document.getElementById('__diag_error_box__');
    if (!box) {
      box = document.createElement('div');
      box.id = '__diag_error_box__';
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;' +
        'background:#fee2e2;color:#7f1d1d;font-family:ui-monospace,monospace;' +
        'font-size:13px;line-height:1.5;padding:14px 16px;max-height:60vh;' +
        'overflow:auto;border-bottom:3px solid #dc2626;white-space:pre-wrap;';
      document.body.appendChild(box);
    }
    box.textContent = 'The page hit ' + errors.length + ' script error(s):\n\n' + errors.join('\n\n---\n\n');
  }
  window.addEventListener('error', function (e) {
    var msg = (e.error && e.error.stack) ? e.error.stack
      : (e.message + '  (' + (e.filename || 'unknown file') + ':' + e.lineno + ')');
    errors.push(msg);
    render();
  });
  window.addEventListener('unhandledrejection', function (e) {
    errors.push('Unhandled promise rejection: ' + ((e.reason && e.reason.stack) || e.reason));
    render();
  });
})();
</script>

<script>

  window.require = function (name) {
    if (name === 'react') return window.React;
    throw new Error('Unexpected require: ' + name);

</script>

// ---------------------------------------------------------------------------
// Reusable form controls
// ---------------------------------------------------------------------------
function Field({ label, required, children, hint }) {
  return (
    <div>
      <label className="block text-xs font-medium text-slate-500 mb-1">
        {label}{required && <span className="text-red-500"> *</span>}
      </label>
      {children}
      {hint && <div className="text-[11px] text-slate-400 mt-1">{hint}</div>}
    </div>
  );
}
const inputCls = "w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-500";

function TextInput({ label, required, value, onChange, type = "text", placeholder, hint }) {
  return (
    <Field label={label} required={required} hint={hint}>
      <input type={type} value={value || ""} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} className={inputCls} />
    </Field>
  );
}
function SelectInput({ label, required, value, onChange, options, hint }) {
  return (
    <Field label={label} required={required} hint={hint}>
      <select value={value || ""} onChange={(e) => onChange(e.target.value)} className={inputCls}>
        <option value="">Select...</option>
        {options.map((o) => (<option key={o} value={o}>{o}</option>))}
      </select>
    </Field>
  );
}
function CheckField({ label, checked, onChange }) {
  return (
    <label className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer select-none">
      <input type="checkbox" checked={!!checked} onChange={(e) => onChange(e.target.checked)} className="h-4 w-4 rounded border-slate-300" />
      {label}
    </label>
  );
}
function DocToggle({ label, checked, onChange, hint }) {
  return (
    <button type="button" onClick={() => onChange(!checked)}
      className={cx("w-full flex items-center justify-between rounded-md border px-4 py-3 text-left transition",
        checked ? "border-emerald-300 bg-emerald-50" : "border-slate-300 bg-white hover:border-slate-400")}>
      <div>
        <div className="text-sm font-medium text-slate-800">{label}</div>
        {hint && <div className="text-xs text-slate-400">{hint}</div>}
      </div>
      {checked ? <CheckCircle2 className="text-emerald-600 shrink-0" size={20} /> : <Upload className="text-slate-400 shrink-0" size={18} />}
    </button>
  );
}
function Badge({ status }) {
  const map = {
    Draft: "bg-slate-100 text-slate-600",
    Submitted: "bg-blue-50 text-blue-700",
    "Submitted (Deferred)": "bg-amber-50 text-amber-700",
    "Compliance Referral": "bg-red-50 text-red-700",
    "Sent to Checker": "bg-indigo-50 text-indigo-700",
    "Returned to Branch": "bg-red-50 text-red-700",
    "Returned by Checker": "bg-amber-50 text-amber-700",
    Active: "bg-emerald-50 text-emerald-700",
    Terminated: "bg-slate-200 text-slate-500",
  };
  return <span className={cx("inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium", map[status] || "bg-slate-100 text-slate-600")}>{status}</span>;
}
function RiskBadge({ r }) {
  if (!r) return <span className="text-xs text-slate-400">-</span>;
  const map = { Low: "bg-emerald-50 text-emerald-700", Medium: "bg-amber-50 text-amber-700", High: "bg-red-50 text-red-700" };
  return <span className={cx("inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium", map[r])}>{r} risk</span>;
}

// ---------------------------------------------------------------------------
// Wizard shell
// ---------------------------------------------------------------------------
function Wizard({ title, subtitle, steps, initialDraft, onCancel, onDone }) {
  const [step, setStep] = useState(0);
  const [draft, setDraft] = useState(initialDraft);
  const setPath = (path, value) => setDraft((prev) => { const next = _.cloneDeep(prev); _.set(next, path, value); return next; });
  const cur = steps[step];
  return (
    <div className="bg-white rounded-lg border border-slate-200 shadow-sm max-w-4xl mx-auto">
      <div className="border-b border-slate-200 px-6 py-4 flex items-center justify-between flex-wrap gap-2">
        <div>
          <div className="text-xs uppercase tracking-wide text-slate-400 font-mono">Step {step + 1} of {steps.length} · {subtitle}</div>
          <h2 className="text-lg font-semibold text-slate-900">{cur.title}</h2>
        </div>
        <div className="flex items-center gap-1.5 text-xs text-slate-400"><Clock size={14} /> Autosaves every 2 minutes</div>
      </div>
      <div className="p-6">{cur.render(draft, setPath, setDraft, { onDone, onCancel, goStep: setStep })}</div>
      {!cur.hideFooter && (
        <div className="border-t border-slate-200 px-6 py-4 flex items-center justify-between">
          <button onClick={() => (step === 0 ? onCancel() : setStep((s) => s - 1))} className="inline-flex items-center gap-1 rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">
            <ChevronLeft size={16} /> {step === 0 ? "Cancel" : "Back"}
          </button>
          <div className="flex gap-1.5">
            {steps.map((s, i) => (<div key={i} className={cx("h-1.5 w-6 rounded-full", i <= step ? "bg-amber-600" : "bg-slate-200")} />))}
          </div>
          <button onClick={() => setStep((s) => Math.min(s + 1, steps.length - 1))} className="inline-flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
            Next <ChevronRight size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

                <div className="text-sm font-medium text-slate-800">Sanctions Screening</div>

        );
      },
    },
    {
      title: "Confirmation & Submit",
      hideFooter: true,
      render: (d, set, setDraft, { onDone, onCancel, goStep }) => {
        const required = [
          ["customer.title", "Title"], ["customer.firstName", "First name"], ["customer.lastName", "Last name"],
          ["customer.maritalStatus", "Marital status"], ["customer.dob", "Date of birth"], ["customer.gender", "Gender"],
          ["customer.idType", "ID type"], ["customer.idNumber", "ID number"], ["branch", "Branch"],
          ["customer.nationality", "Nationality"], ["customer.countryOfResidence", "Country of residence"],
          ["customer.tpin", "TPIN"], ["customer.mobile", "Mobile phone"], ["customer.houseNumber", "House/plot number"],
          ["customer.street", "Street/area"], ["customer.province", "Province"], ["customer.district", "District"],
          ["customer.occupation", "Occupation"], ["customer.employmentType", "Employment type"],
          ["customer.sourceOfIncome", "Source of income"], ["customer.incomeRange", "Income range"],
          ["customer.nextOfKinName", "Next of kin name"], ["customer.nextOfKinMobile", "Next of kin mobile"],
          ["customer.terms", "Terms & conditions"], ["customer.consent", "Consent form"],
          ["accountProduct", "Account product"], ["riskRating", "Risk rating"], ["sanctionsResult", "Sanctions screening"],
        ];
        const missing = required.filter(([p]) => !_.get(d, p));
        const wantDeferral = !!d.wantDeferral;
        const deferralReason = d.deferralReason || "";
        const blockedBySanctions = d.sanctionsResult === "Positive Hit";
        return (
          <div className="space-y-5">
            <div className="rounded-md border border-slate-200 divide-y divide-slate-100 text-sm">
              <div className="grid grid-cols-2 gap-x-6 gap-y-2 p-4">
                <div><span className="text-slate-400">Customer</span><div className="font-medium text-slate-800">{d.customer?.title} {d.customer?.firstName} {d.customer?.lastName}</div></div>
                <div><span className="text-slate-400">Branch</span><div className="font-medium text-slate-800">{d.branch || "-"}</div></div>
                <div><span className="text-slate-400">Account</span><div className="font-medium text-slate-800">{d.accountCategory} — {d.accountProduct || "-"}</div></div>
                <div><span className="text-slate-400">Risk Rating</span><div><RiskBadge r={d.riskRating} /></div></div>
              </div>
            </div>
            {missing.length > 0 && (
              <div className="rounded-md border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
                <div className="font-medium flex items-center gap-2 mb-1"><AlertTriangle size={16} /> {missing.length} mandatory item(s) incomplete</div>
                <ul className="list-disc list-inside text-xs space-y-0.5">{missing.map(([, label]) => <li key={label}>{label}</li>)}</ul>
                <div className="mt-3">
                  <CheckField label="Request a deferral for the missing items (subject to supervisor approval)" checked={wantDeferral} onChange={(v) => set("wantDeferral", v)} />
                  {wantDeferral && <textarea value={deferralReason} onChange={(e) => set("deferralReason", e.target.value)} placeholder="Reason for deferral..." className={cx(inputCls, "mt-2")} rows={2} />}
                </div>
              </div>
            )}
            {blockedBySanctions && (
              <div className="rounded-md border border-red-200 bg-red-50 p-4 text-sm text-red-800 flex gap-2">
                <AlertTriangle size={16} className="shrink-0" />
                Positive sanctions match — this application will be routed to Compliance and cannot be onboarded until cleared.
              </div>
            )}
            <div className="flex items-center justify-between border-t border-slate-200 pt-4">
              <button onClick={onCancel} className="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button>
              <button
                disabled={missing.length > 0 && !wantDeferral}
                onClick={() => onDone({ ...d, deferral: wantDeferral ? { reason: deferralReason, expiresAt: addDays(today(), 7) } : null })}
                className={cx("rounded-md px-5 py-2.5 text-sm font-semibold text-white", (missing.length > 0 && !wantDeferral) ? "bg-slate-300 cursor-not-allowed" : "bg-amber-600 hover:bg-amber-700")}>
                {blockedBySanctions ? "Submit for Compliance Review" : wantDeferral ? "Submit with Deferral" : "Submit Application"}
              </button>
            </div>
          </div>
        );
      },
    },
  ];
}

function AdditionalAccountFlow({ onCancel, onCreate, pushToast }) {
  const [query, setQuery] = useState("");
  const [found, setFound] = useState(null);
  const [searched, setSearched] = useState(false);
  const [docsValid, setDocsValid] = useState(true);
  const [category, setCategory] = useState("");
  const [product, setProduct] = useState("");

  function search() {
    setSearched(true);
    const m = EXISTING_CUSTOMERS.find((c) => c.cif.toLowerCase() === query.trim().toLowerCase() || c.nrc.toLowerCase() === query.trim().toLowerCase());
    setFound(m || null);
    if (m) setDocsValid(m.docsValid);
  }

  if (!found) {
    return (
      <div className="max-w-xl mx-auto bg-white rounded-lg border border-slate-200 shadow-sm p-6">
        <h2 className="text-lg font-semibold text-slate-900 mb-1">Additional Account — Existing Customer</h2>
        <p className="text-sm text-slate-500 mb-4">Search by NRC / registration number or CIF to confirm the customer already exists in the core banking system.</p>
        <div className="flex gap-2">
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="e.g. CIF3820194 or 123456/10/1" className={inputCls} />
          <button onClick={search} className="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white flex items-center gap-1"><Search size={16} /> Search</button>
        </div>
        <div className="mt-3 text-xs text-slate-400">Try <button className="underline" onClick={() => setQuery("CIF3820194")}>CIF3820194</button> (Chanda Mwansa) or <button className="underline" onClick={() => setQuery("REG-2019-4471")}>REG-2019-4471</button> (Bwalya Trading Ltd).</div>
        {searched && !found && (
          <div className="mt-5 rounded-md border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800 flex items-center justify-between">
            <span>Customer not found in core banking.</span>
            <button onClick={onCancel} className="text-xs font-semibold underline">Go to New Account Opening</button>
          </div>
        )}
        <div className="mt-6"><button onClick={onCancel} className="text-sm text-slate-500">Cancel</button></div>
      </div>
    );
  }

  const allowedProducts = category === "Savings" ? SAVINGS_ACCOUNTS.filter((a) => a !== "Other") : CURRENT_ACCOUNTS.filter((a) => a !== "Other" && a !== "Easy Kwacha Student");

  return (
    <div className="max-w-2xl mx-auto bg-white rounded-lg border border-slate-200 shadow-sm">
      <div className="border-b border-slate-200 px-6 py-4">
        <h2 className="text-lg font-semibold text-slate-900">Additional Account</h2>
        <p className="text-xs text-slate-400">Existing CIF will be reused — no new customer record is created.</p>
      </div>
      <div className="p-6 space-y-5">
        <div className="rounded-md border border-slate-200 p-4 grid grid-cols-2 gap-y-2 text-sm">
          <div><span className="text-slate-400">Customer / Company</span><div className="font-medium text-slate-800">{found.name}</div></div>
          <div><span className="text-slate-400">CIF</span><div className="font-mono font-medium text-slate-800">{found.cif}</div></div>
          <div><span className="text-slate-400">NRC / Reg. No.</span><div className="font-medium text-slate-800">{found.nrc}</div></div>
          <div><span className="text-slate-400">Home Branch</span><div className="font-medium text-slate-800">{found.branch}</div></div>
        </div>
        <Field label="Are all existing documents still valid?" required>
          <div className="flex gap-2">
            <button onClick={() => setDocsValid(true)} className={cx("flex-1 rounded-md border px-3 py-2 text-sm", docsValid ? "border-emerald-600 bg-emerald-600 text-white" : "border-slate-300 text-slate-600")}>Yes, still valid</button>
            <button onClick={() => setDocsValid(false)} className={cx("flex-1 rounded-md border px-3 py-2 text-sm", !docsValid ? "border-amber-500 bg-amber-500 text-white" : "border-slate-300 text-slate-600")}>No, needs update</button>
          </div>
        </Field>
        {!docsValid && <DocToggle label="Updated document uploaded" hint="Upload the expired / missing document under the designated folder." checked={false} onChange={() => pushToast("Document marked for upload — attach in KYC review.", "ok")} />}
        <div className="grid grid-cols-2 gap-4">
          <Field label="Account Category" required>
            <div className="flex gap-2">
              {["Savings", "Current"].map((c) => (<button key={c} onClick={() => { setCategory(c); setProduct(""); }} className={cx("flex-1 rounded-md border px-3 py-2 text-sm", category === c ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 text-slate-600")}>{c}</button>))}
            </div>
          </Field>
          {category && <SelectInput label="Account Product" required value={product} onChange={setProduct} options={allowedProducts} />}
        </div>
      </div>
      <div className="border-t border-slate-200 px-6 py-4 flex items-center justify-between">
        <button onClick={onCancel} className="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600">Cancel</button>
        <button disabled={!category || !product} onClick={() => {
          const app = {
            id: genId(), kind: "retail", isAdditional: true, branch: found.branch, createdAt: today(),
            accountHolderType: "individual", accountCategory: category, accountProduct: product,
            customer: { firstName: found.name.split(" ")[0], lastName: found.name.split(" ").slice(1).join(" "), idNumber: found.nrc, incomeRange: found.incomeRange },
            jointHolders: [], riskRating: "Low", sanctionsResult: "Clear", documents: { idProof: true, proofOfResidence: docsValid },
            status: "Submitted", cifNumber: found.cif, accountNumber: null,
            auditLog: [{ action: `Additional account requested (${product})`, actor: `Branch Staff · ${found.branch}`, at: today() }],
          };
          onCreate(app);
        }} className={cx("rounded-md px-5 py-2.5 text-sm font-semibold text-white", (!category || !product) ? "bg-slate-300 cursor-not-allowed" : "bg-amber-600 hover:bg-amber-700")}>Submit Request</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// KYC Processing Centre (maker / checker / compliance)
// ---------------------------------------------------------------------------
function displayName(app) {
  if (app.kind === "corporate") return app.company?.name || "Unnamed company";
  return [app.customer?.title, app.customer?.firstName, app.customer?.lastName].filter(Boolean).join(" ") || "Unnamed customer";
}
function docList(app) {
  const d = app.documents || {};
  return Object.entries(d).filter(([, v]) => v).map(([k]) => k.replace(/([A-Z])/g, " $1").replace(/^./, (s) => s.toUpperCase()));
}

function DocCarousel({ app }) {
  const docs = docList(app);
  const [i, setI] = useState(0);
  if (docs.length === 0) return <div className="text-xs text-slate-400 italic p-4 border border-dashed border-slate-200 rounded-md">No documents captured yet.</div>;
  const idx = Math.min(i, docs.length - 1);
  return (
    <div className="rounded-md border border-slate-200 overflow-hidden">
      <div className="flex items-center justify-center bg-slate-50 h-40 relative">
        <div className="text-center">
          <FileText className="mx-auto text-slate-300 mb-1" size={32} />
          <div className="text-sm font-medium text-slate-600">{docs[idx]}</div>
          <div className="text-[10px] text-slate-400 tracking-widest uppercase">Preview watermark · view only</div>
        </div>
      </div>
      <div className="flex items-center justify-between px-3 py-2 bg-white border-t border-slate-200 text-xs text-slate-500">
        <button onClick={() => setI((n) => Math.max(0, n - 1))} className="inline-flex items-center gap-1 disabled:opacity-30" disabled={idx === 0}><ChevronLeft size={14} /> Back</button>
        <span>{idx + 1} of {docs.length}</span>
        <button onClick={() => setI((n) => Math.min(docs.length - 1, n + 1))} className="inline-flex items-center gap-1 disabled:opacity-30" disabled={idx === docs.length - 1}>Next <ChevronRight size={14} /></button>
      </div>
    </div>
  );
}

function incomeMismatch(app) {
  if (app.kind !== "retail") return false;
  const lowIncome = app.customer?.incomeRange === "ZMW 0 - 3,500";
  const isLite = LITE_PRODUCTS.includes(app.accountProduct);
  return lowIncome !== isLite && !!app.customer?.incomeRange && !!app.accountProduct;
}

function ReviewPanel({ app, role, onUpdate, pushToast }) {
  const [amendOpen, setAmendOpen] = useState(false);
  const [amend, setAmend] = useState({});
  const canMaker = role === "KYC Initiator" && ["Submitted", "Submitted (Deferred)", "Returned by Checker"].includes(app.status);
  const canChecker = role === "KYC Checker" && app.status === "Sent to Checker";
  const canCompliance = role === "Compliance Officer" && app.status === "Compliance Referral";
  const canBranchResubmit = role === "Branch Staff" && app.status === "Returned to Branch";

  function log(action) {
    onUpdate(app.id, (a) => ({ ...a, auditLog: [...a.auditLog, { action, actor: role, at: today() }] }));
  }

  return (
    <div className="space-y-4">
      <div className="rounded-md border border-slate-200 p-4">
        <div className="flex items-start justify-between">
          <div>
            <div className="text-base font-semibold text-slate-900">{displayName(app)}</div>
            <div className="text-xs text-slate-500 mt-0.5">
              {app.kind === "corporate" ? `Reg. No. ${app.company?.registrationNumber || "-"}` : `${app.customer?.idType || "ID"} · ${app.customer?.idNumber || "-"}`}
              {app.customer?.province && ` · ${app.customer.district}, ${app.customer.province}`}
              {app.company?.district && ` · ${app.company.district}, ${app.company.province}`}
            </div>
          </div>
          <Badge status={app.status} />
        </div>
        <div className="mt-3 flex flex-wrap gap-2 text-xs">
          <span className="rounded-full bg-slate-100 px-2.5 py-1 text-slate-600">{app.isAdditional ? "Additional account" : app.kind === "corporate" ? "Corporate" : "Retail"}</span>
          {app.accountProduct && <span className="rounded-full bg-slate-100 px-2.5 py-1 text-slate-600">{app.accountCategory} · {app.accountProduct}</span>}
          <RiskBadge r={app.riskRating} />
          {app.cifNumber && <span className="rounded-full bg-slate-900 text-white px-2.5 py-1 font-mono">{app.cifNumber}</span>}
        </div>
      </div>

      {incomeMismatch(app) && (
        <div className="rounded-md border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800 flex items-center gap-2"><AlertTriangle size={14} /> Account product may not align with declared income range — confirm with branch before proceeding.</div>
      )}

      <div>
        <div className="text-xs font-medium text-slate-500 mb-1.5">Documents</div>
        <DocCarousel app={app} />
      </div>

      {canMaker && (
        <div className="rounded-md border border-indigo-200 bg-indigo-50/50 p-4 space-y-3">
          <div className="text-sm font-semibold text-indigo-900">KYC Initiator actions</div>
          {!amendOpen ? (
            <div className="flex flex-wrap gap-2">
              <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Sent to Checker", cifNumber: a.cifNumber || genCIF() })); log("Documents validated, CIF created, sent to Checker"); pushToast("CIF created and sent to Checker.", "ok"); }} className="rounded-md bg-indigo-600 px-3 py-2 text-xs font-semibold text-white hover:bg-indigo-700">All documents valid → Create CIF & Send to Checker</button>
              <button onClick={() => setAmendOpen(true)} className="rounded-md border border-indigo-300 px-3 py-2 text-xs font-semibold text-indigo-700">Minor errors → Amend</button>
              <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Returned to Branch" })); log("Fundamental document error — returned to branch"); pushToast("Application returned to branch.", "warn"); }} className="rounded-md border border-red-300 px-3 py-2 text-xs font-semibold text-red-700">Fundamental error → Reject to Branch</button>
            </div>
          ) : (
            <div className="space-y-2">
              <div className="grid grid-cols-2 gap-2">
                <TextInput label="Corrected name spelling" value={amend.name} onChange={(v) => setAmend({ ...amend, name: v })} />
                <TextInput label="Corrected ID / NRC number" value={amend.id} onChange={(v) => setAmend({ ...amend, id: v })} />
              </div>
              <div className="flex gap-2">
                <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Sent to Checker", cifNumber: a.cifNumber || genCIF() })); log(`Minor amendments applied (${[amend.name && "name", amend.id && "ID number"].filter(Boolean).join(", ") || "spelling"}), CIF created, sent to Checker`); pushToast("Amendments applied — sent to Checker.", "ok"); setAmendOpen(false); }} className="rounded-md bg-indigo-600 px-3 py-2 text-xs font-semibold text-white">Apply & Send to Checker</button>
                <button onClick={() => setAmendOpen(false)} className="text-xs text-slate-500">Cancel</button>
              </div>
            </div>
          )}
        </div>
      )}

      {canChecker && (
        <div className="rounded-md border border-emerald-200 bg-emerald-50/50 p-4 space-y-3">
          <div className="text-sm font-semibold text-emerald-900">KYC Checker actions</div>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => { const acct = genAcct(); onUpdate(app.id, (a) => ({ ...a, status: "Active", accountNumber: acct })); log(`Account approved and activated (${acct}); SMS/Email notification sent to customer and branch`); pushToast("Account activated — notifications sent.", "ok"); }} className="rounded-md bg-emerald-600 px-3 py-2 text-xs font-semibold text-white hover:bg-emerald-700">Approve & Activate</button>
            <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Returned by Checker" })); log("Returned to Maker for correction"); pushToast("Returned to Maker.", "warn"); }} className="rounded-md border border-amber-300 px-3 py-2 text-xs font-semibold text-amber-700">Return to Maker</button>
          </div>
        </div>
      )}

      {canCompliance && (
        <div className="rounded-md border border-red-200 bg-red-50/50 p-4 space-y-3">
          <div className="text-sm font-semibold text-red-900">Compliance actions — positive sanctions match</div>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Submitted" })); log("Compliance: no objection — released to KYC queue"); pushToast("No objection — released to KYC queue.", "ok"); }} className="rounded-md bg-slate-900 px-3 py-2 text-xs font-semibold text-white">No Objection → Proceed</button>
            <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Terminated" })); log("Compliance: positive hit confirmed — process terminated"); pushToast("Application terminated.", "warn"); }} className="rounded-md border border-red-300 px-3 py-2 text-xs font-semibold text-red-700">Confirm Positive Hit → Terminate</button>
          </div>
        </div>
      )}

      {canBranchResubmit && (
        <div className="rounded-md border border-slate-200 p-4 space-y-2">
          <div className="text-sm font-semibold text-slate-800">Branch resubmission</div>
          <p className="text-xs text-slate-500">Correct the flagged issue offline, then resubmit to the KYC queue.</p>
          <button onClick={() => { onUpdate(app.id, (a) => ({ ...a, status: "Submitted" })); log("Corrected and resubmitted by branch"); pushToast("Resubmitted to KYC queue.", "ok"); }} className="rounded-md bg-slate-900 px-3 py-2 text-xs font-semibold text-white">Resubmit to KYC Queue</button>
        </div>
      )}

      <div>
        <div className="text-xs font-medium text-slate-500 mb-1.5">Audit Trail</div>
        <div className="space-y-1.5">
          {app.auditLog.slice().reverse().map((l, i) => (
            <div key={i} className="flex items-start gap-2 text-xs text-slate-500">
              <Clock size={12} className="mt-0.5 shrink-0 text-slate-300" />
              <div><span className="text-slate-700">{l.action}</span> — {l.actor} · {fmtDate(l.at)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function KycQueue({ apps, role, onUpdate, pushToast }) {
  const [selected, setSelected] = useState(null);
  const filterByRole = {
    "Branch Staff": (a) => a.status === "Returned to Branch",
    "KYC Initiator": (a) => ["Submitted", "Submitted (Deferred)", "Returned by Checker"].includes(a.status),
    "KYC Checker": (a) => a.status === "Sent to Checker",
    "Compliance Officer": (a) => a.status === "Compliance Referral",
  };
  const queue = apps.filter(filterByRole[role]);
  const selectedApp = apps.find((a) => a.id === selected);

  return (
    <div className="grid grid-cols-12 gap-5">
      <div className="col-span-12 lg:col-span-5">
        <div className="text-xs font-medium text-slate-500 mb-2">{role} queue — {queue.length} item(s)</div>
        <div className="space-y-2">
          {queue.length === 0 && <div className="text-sm text-slate-400 border border-dashed border-slate-200 rounded-md p-6 text-center">Nothing waiting in this queue.</div>}
          {queue.map((a) => (
            <button key={a.id} onClick={() => setSelected(a.id)} className={cx("w-full text-left rounded-md border p-3 transition", selected === a.id ? "border-slate-900 bg-slate-50" : "border-slate-200 hover:border-slate-300")}>
              <div className="flex items-center justify-between">
                <div className="text-sm font-medium text-slate-800">{displayName(a)}</div>
                <Badge status={a.status} />
              </div>
              <div className="text-xs text-slate-400 mt-1">{a.branch} · {fmtDate(a.createdAt)} · {a.isAdditional ? "Additional account" : a.kind}</div>
            </button>
          ))}
        </div>
      </div>
      <div className="col-span-12 lg:col-span-7">
        {selectedApp ? <ReviewPanel app={selectedApp} role={role} onUpdate={onUpdate} pushToast={pushToast} /> : (
          <div className="h-full min-h-[240px] flex items-center justify-center text-sm text-slate-400 border border-dashed border-slate-200 rounded-md">Select an application to review</div>
        )}
      </div>
    </div>
  );
}

function StatCard({ label, value, icon: Icon, tone = "slate" }) {
  const tones = { slate: "text-slate-700 bg-slate-100", emerald: "text-emerald-700 bg-emerald-50", amber: "text-amber-700 bg-amber-50", red: "text-red-700 bg-red-50", indigo: "text-indigo-700 bg-indigo-50" };
  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4 flex items-center gap-3">
      <div className={cx("h-10 w-10 rounded-md flex items-center justify-center shrink-0", tones[tone])}><Icon size={18} /></div>
      <div><div className="text-2xl font-semibold text-slate-900 leading-none">{value}</div><div className="text-xs text-slate-500 mt-1">{label}</div></div>
    </div>
  );
}

function Dashboard({ apps, setView }) {
  const active = apps.filter((a) => a.status === "Active").length;
  const inProgress = apps.filter((a) => ["Submitted", "Submitted (Deferred)", "Sent to Checker", "Returned by Checker"].includes(a.status)).length;
  const referrals = apps.filter((a) => a.status === "Compliance Referral").length;
  const returned = apps.filter((a) => a.status === "Returned to Branch").length;
  const highRisk = apps.filter((a) => a.riskRating === "High").length;
  const recent = apps.flatMap((a) => a.auditLog.map((l) => ({ ...l, app: displayName(a) }))).sort((x, y) => new Date(y.at) - new Date(x.at)).slice(0, 8);

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
        <StatCard label="Active Accounts" value={active} icon={CheckCircle2} tone="emerald" />
        <StatCard label="In Progress" value={inProgress} icon={RefreshCw} tone="indigo" />
        <StatCard label="Compliance Referrals" value={referrals} icon={AlertTriangle} tone="red" />
        <StatCard label="Returned to Branch" value={returned} icon={XCircle} tone="amber" />
        <StatCard label="High-Risk Accounts" value={highRisk} icon={Shield} tone="slate" />
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div className="md:col-span-2 rounded-lg border border-slate-200 bg-white p-5">
          <h3 className="text-sm font-semibold text-slate-800 mb-3">Recent Activity</h3>
          <div className="space-y-3">
            {recent.map((l, i) => (
              <div key={i} className="flex items-start gap-3 text-sm">
                <div className="h-6 w-6 rounded-full bg-slate-100 flex items-center justify-center shrink-0 mt-0.5"><Clock size={12} className="text-slate-400" /></div>
                <div><span className="font-medium text-slate-800">{l.app}</span> — {l.action}<div className="text-xs text-slate-400">{l.actor} · {fmtDate(l.at)}</div></div>
              </div>
            ))}
          </div>
        </div>
        <div className="rounded-lg border border-slate-200 bg-white p-5">
          <h3 className="text-sm font-semibold text-slate-800 mb-3">Quick Actions</h3>
          <div className="space-y-2">
            <button onClick={() => setView("retail")} className="w-full flex items-center justify-between rounded-md border border-slate-200 px-3 py-2.5 text-sm text-slate-700 hover:border-slate-400"><span className="flex items-center gap-2"><UserPlus size={16} /> New Retail Account</span><ArrowRight size={14} /></button>
            <button onClick={() => setView("corporate")} className="w-full flex items-center justify-between rounded-md border border-slate-200 px-3 py-2.5 text-sm text-slate-700 hover:border-slate-400"><span className="flex items-center gap-2"><Building2 size={16} /> New Corporate Account</span><ArrowRight size={14} /></button>
            <button onClick={() => setView("additional")} className="w-full flex items-center justify-between rounded-md border border-slate-200 px-3 py-2.5 text-sm text-slate-700 hover:border-slate-400"><span className="flex items-center gap-2"><RefreshCw size={16} /> Additional Account</span><ArrowRight size={14} /></button>
            <button onClick={() => setView("kyc")} className="w-full flex items-center justify-between rounded-md border border-slate-200 px-3 py-2.5 text-sm text-slate-700 hover:border-slate-400"><span className="flex items-center gap-2"><ClipboardCheck size={16} /> KYC Processing Centre</span><ArrowRight size={14} /></button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Reports({ apps }) {
  const deferred = apps.filter((a) => a.deferral);
  const highRisk = apps.filter((a) => a.riskRating === "High");
  return (
    <div className="space-y-6">
      <div className="rounded-lg border border-slate-200 bg-white overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-200"><h3 className="text-sm font-semibold text-slate-800">All Applications</h3></div>
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs uppercase text-slate-400"><tr>
            <th className="text-left px-5 py-2 font-medium">Customer / Company</th><th className="text-left px-5 py-2 font-medium">Type</th>
            <th className="text-left px-5 py-2 font-medium">Branch</th><th className="text-left px-5 py-2 font-medium">Submitted</th>
            <th className="text-left px-5 py-2 font-medium">CIF</th><th className="text-left px-5 py-2 font-medium">Account No.</th>
            <th className="text-left px-5 py-2 font-medium">Status</th>
          </tr></thead>
          <tbody className="divide-y divide-slate-100">
            {apps.map((a) => (
              <tr key={a.id}>
                <td className="px-5 py-2.5 font-medium text-slate-800">{displayName(a)}</td>
                <td className="px-5 py-2.5 text-slate-500">{a.isAdditional ? "Additional" : a.kind}</td>

                <td className="px-5 py-2.5 text-slate-500">{fmtDate(a.createdAt)}</td>

                <td className="px-5 py-2.5 font-mono text-xs text-slate-500">{a.accountNumber || "-"}</td>

              </tr>

      <div className="grid md:grid-cols-2 gap-5">
        <div className="rounded-lg border border-slate-200 bg-white overflow-hidden">
          <div className="px-5 py-3 border-b border-slate-200"><h3 className="text-sm font-semibold text-slate-800">High-Risk Accounts — EDD Review Due</h3></div>
          <div className="divide-y divide-slate-100">
            {highRisk.length === 0 && <div className="p-5 text-sm text-slate-400">None on file.</div>}
            {highRisk.map((a) => (
              <div key={a.id} className="px-5 py-3 flex items-center justify-between text-sm">
                <span className="font-medium text-slate-700">{displayName(a)}</span>
                <span className="text-xs text-slate-400">Next review {fmtDate(addDays(a.createdAt, 365 - 30))}</span>
              </div>
            ))}
          </div>

        <div className="rounded-lg border border-slate-200 bg-white overflow-hidden">
          <div className="px-5 py-3 border-b border-slate-200"><h3 className="text-sm font-semibold text-slate-800">Deferrals — Expiring</h3></div>
          <div className="divide-y divide-slate-100">
            {deferred.length === 0 && <div className="p-5 text-sm text-slate-400">No active deferrals.</div>}
            {deferred.map((a) => (
              <div key={a.id} className="px-5 py-3 flex items-center justify-between text-sm">
                <span className="font-medium text-slate-700">{displayName(a)}</span>
                <span className="text-xs text-amber-600">Expires {fmtDate(a.deferral.expiresAt)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------------
function App() {
  const [apps, setApps] = useState(SEED_APPS);
  const [view, setView] = useState("dashboard");
  const [role, setRole] = useState("Branch Staff");
  const [toasts, setToasts] = useState([]);

  function pushToast(message, type = "ok") {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4500);
  }
  function addApp(app) { setApps((a) => [app, ...a]); pushToast(`Application ${app.id} submitted.`, "ok"); setView("dashboard"); }
  function updateApp(id, fn) { setApps((prev) => prev.map((a) => (a.id === id ? fn(a) : a))); }

  const nav = [
    { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { key: "retail", label: "New Retail Account", icon: UserPlus },

      <div className="sticky top-0 z-30 bg-slate-900 text-white">

            <div>

            <select value={role} onChange={(e) => setRole(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-md text-xs px-2.5 py-1.5 text-white focus:outline-none">
              {ROLES.map((r) => (<option key={r} value={r}>{r}</option>))}
            </select>
          </div>
        </div>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 pb-2 flex items-center gap-1 overflow-x-auto">
          {nav.map((n) => (
            <button key={n.key} onClick={() => setView(n.key)} className={cx("inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-medium whitespace-nowrap transition", view === n.key ? "bg-white text-slate-900" : "text-slate-300 hover:bg-slate-800")}>
              <n.icon size={14} /> {n.label}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {view === "dashboard" && <Dashboard apps={apps} setView={setView} />}
        {view === "retail" && <RetailWizard onCancel={() => setView("dashboard")} onCreate={addApp} pushToast={pushToast} />}
        {view === "corporate" && <CorporateWizard onCancel={() => setView("dashboard")} onCreate={addApp} pushToast={pushToast} />}
        {view === "additional" && <AdditionalAccountFlow onCancel={() => setView("dashboard")} onCreate={addApp} pushToast={pushToast} />}
        {view === "kyc" && <KycQueue apps={apps} role={role} onUpdate={updateApp} pushToast={pushToast} />}
        {view === "reports" && <Reports apps={apps} />}
      </div>

      <div className="fixed bottom-4 right-4 z-50 space-y-2 w-80">
        {toasts.map((t) => (
          <div key={t.id} className={cx("rounded-md px-4 py-3 text-sm shadow-lg border flex items-start gap-2",
            t.type === "ok" ? "bg-white border-emerald-200 text-emerald-800" : "bg-white border-amber-200 text-amber-800")}>
            {t.type === "ok" ? <CheckCircle2 size={16} className="shrink-0 mt-0.5" /> : <AlertTriangle size={16} className="shrink-0 mt-0.5" />}
            <span>{t.message}</span>
          </div>
        ))}
      </div>
    </div>
  );
}


try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  console.error(e);
  document.getElementById('root').innerHTML =
    '<pre style="white-space:pre-wrap;padding:16px;color:#7f1d1d;background:#fee2e2;font-family:ui-monospace,monospace;">' +
    'App crashed while mounting:\n\n' + (e && e.stack ? e.stack : String(e)) +
    '</pre>';
}
</script>

<script>
  // Manually transform the app source instead of using Babel's automatic
  // <script type="text/babel"> scanner, so we can force the *classic* JSX
  // runtime (React.createElement calls against the global `React`) rather
  // than the *automatic* runtime, which newer Babel versions default to
  // and which compiles to `import { jsx as _jsx } from "react/jsx-runtime"`
  // — a real ES module import that a classic <script> can't execute, and
  // the exact cause of the "Cannot use import statement outside a module"
  // error.
  try {
    const source = document.getElementById('app-source').textContent;
    const output = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]],
    }).code;
    const script = document.createElement('script');
    script.text = output;
    document.body.appendChild(script);
  } catch (e) {
    console.error(e);
    document.getElementById('root').innerHTML =
      '<pre style="white-space:pre-wrap;padding:16px;color:#7f1d1d;background:#fee2e2;font-family:ui-monospace,monospace;">' +
      'Babel transform failed:\n\n' + (e && e.stack ? e.stack : String(e)) +
      '</pre>';
  }
</script>
